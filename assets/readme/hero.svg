<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">kboot — Boot into all your EKS clusters at once</title>
  <desc id="desc">A DevOps CLI tool for managing multiple Amazon EKS clusters with parallel authentication and k9s integration.</desc>

  <defs>
    <clipPath id="terminal-clip">
      <rect x="0" y="0" width="1200" height="380" rx="12"/>
    </clipPath>
    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b067e8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#b067e8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#b067e8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="12" fill="#0d1117"/>
  
  <!-- Terminal window chrome -->
  <rect x="0" y="0" width="1200" height="32" rx="12" fill="#161b22"/>
  <rect x="0" y="20" width="1200" height="12" fill="#161b22"/>
  
  <!-- Traffic lights -->
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  
  <!-- Terminal title -->
  <text x="600" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b949e" text-anchor="middle">kboot — EKS Cluster Manager</text>

  <!-- Main content area -->
  <g id="content" transform="translate(0, 40)">
    
    <!-- Left side: ASCII art + Name -->
    <g id="brand" transform="translate(56, 24)">
      <!-- ASCII art representation (simplified cube) -->
      <g transform="translate(0, 8)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#28c840" xml:space="preserve">
          <tspan x="0" dy="0">      .-----------.</tspan>
          <tspan x="0" dy="18">     /           /|</tspan>
          <tspan x="0" dy="18">    /           / |</tspan>
          <tspan x="0" dy="18">   /           /  |</tspan>
          <tspan x="0" dy="18">  /           /   |</tspan>
          <tspan x="0" dy="18"> /           /    |</tspan>
          <tspan x="0" dy="18">.-----------.    ;</tspan>
          <tspan x="0" dy="18">|           |   /</tspan>
          <tspan x="0" dy="18">|           |  /</tspan>
          <tspan x="0" dy="18">|           | /</tspan>
          <tspan x="0" dy="18">|           |/</tspan>
          <tspan x="0" dy="18">'-----------'</tspan>
        </text>
      </g>
      
      <!-- Project name -->
      <text x="220" y="40" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="700" fill="#e6edf3">
        k<tspan fill="#b067e8">boot</tspan>
      </text>
      
      <!-- Tagline -->
      <text x="220" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#8b949e">
        Boot into all your EKS clusters at once.
      </text>
      
      <!-- Terminal prompt -->
      <g transform="translate(220, 110)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7ee787">$</text>
        <text x="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">kboot</text>
        <text x="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e"># no AWS CLI needed</text>
        <!-- Blinking cursor -->
        <rect x="80" y="-12" width="10" height="18" fill="#b067e8" opacity="0.8">
          <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
    
    <!-- Right side: Feature pills -->
    <g id="features" transform="translate(760, 40)">
      <!-- Feature cards in terminal style -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="380" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#28c840">✓</text>
        <text x="36" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">Pure AWS SDK</text>
        <text x="200" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">— No CLI dependency</text>
      </g>
      
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="380" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#28c840">✓</text>
        <text x="36" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">Parallel auth</text>
        <text x="175" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">— 5 concurrent workers</text>
      </g>
      
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="380" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#28c840">✓</text>
        <text x="36" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">Zero pollution</text>
        <text x="180" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">— Temporary kubeconfigs</text>
      </g>
      
      <g transform="translate(0, 144)">
        <rect x="0" y="0" width="380" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#28c840">✓</text>
        <text x="36" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">SSO + Static auth</text>
        <text x="200" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">— Both supported</text>
      </g>
      
      <g transform="translate(0, 192)">
        <rect x="0" y="0" width="380" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#28c840">✓</text>
        <text x="36" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">TUI Dashboard</text>
        <text x="178" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">— Built with Bubble Tea</text>
      </g>
    </g>
    
    <!-- Bottom bar: metadata -->
    <g id="metadata" transform="translate(56, 290)">
      <line x1="0" y1="0" x2="1088" y2="0" stroke="#21262d" stroke-width="1"/>
      
      <!-- Go version -->
      <g transform="translate(0, 16)">
        <rect width="80" height="24" rx="4" fill="#161b22"/>
        <text x="40" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b949e" text-anchor="middle">Go 1.21+</text>
      </g>
      
      <!-- License -->
      <g transform="translate(96, 16)">
        <rect width="90" height="24" rx="4" fill="#161b22"/>
        <text x="45" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b949e" text-anchor="middle">Apache-2.0</text>
      </g>
      
      <!-- Platform -->
      <g transform="translate(202, 16)">
        <rect width="130" height="24" rx="4" fill="#161b22"/>
        <text x="65" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b949e" text-anchor="middle">Linux / macOS / Win</text>
      </g>
      
      <!-- k9s integration -->
      <g transform="translate(348, 16)">
        <rect width="110" height="24" rx="4" fill="#161b22"/>
        <text x="55" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b949e" text-anchor="middle">k9s compatible</text>
      </g>
      
      <!-- k8s icon hint -->
      <g transform="translate(1040, 8)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#326ce5">⎈</text>
      </g>
    </g>
    
  </g>
</svg>
