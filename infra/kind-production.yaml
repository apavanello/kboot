kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kboot-production
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "environment=production"
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6444
