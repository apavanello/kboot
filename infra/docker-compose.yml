version: "3.8"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: kboot-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=eks,iam,sts,ec2,s3,cloudwatch
      - EAGER_SERVICES_LOADING=1
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./vol}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - kboot-net

networks:
  kboot-net:
    driver: bridge
