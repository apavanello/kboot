name: Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    - name: Test
      run: go test -v ./...

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Read VERSION
      id: get_version
      run: |
        VERSION=$(cat version.txt | tr -d '[:space:]')
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Detected version: $VERSION"

    - name: Check if Tag Exists
      uses: mukunku/tag-exists-action@v1.6.0
      id: check_tag
      with: 
        tag: 'v${{ env.VERSION }}'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Go
      if: steps.check_tag.outputs.exists == 'false'
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build binaries
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        GOOS=linux GOARCH=amd64 go build -o kboot-linux-amd64 .
        GOOS=windows GOARCH=amd64 go build -o kboot-windows-amd64.exe .
        GOOS=darwin GOARCH=amd64 go build -o kboot-darwin-amd64 .
        GOOS=darwin GOARCH=arm64 go build -o kboot-darwin-arm64 .

    - name: Create Release
      if: steps.check_tag.outputs.exists == 'false'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}
        name: Release v${{ env.VERSION }}
        draft: false
        prerelease: false
        files: |
          kboot-linux-amd64
          kboot-windows-amd64.exe
          kboot-darwin-amd64
          kboot-darwin-arm64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
